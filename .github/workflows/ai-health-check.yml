name: AI Weekly Code Health Check

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv sync
          uv pip install bandit pip-audit semgrep

      # ── Lint checks ──────────────────────────────────────────────
      - name: Run ruff check
        run: uv run ruff check extra scripts 2>&1 | tee $GITHUB_WORKSPACE/ruff_check.txt || true

      - name: Run ruff format check
        run: uv run ruff format extra scripts --check 2>&1 | tee $GITHUB_WORKSPACE/ruff_format.txt || true

      - name: Run pyright
        run: npx pyright extra scripts 2>&1 | tee $GITHUB_WORKSPACE/pyright.txt || true

      # ── Security checks ──────────────────────────────────────────
      - name: Run bandit security scan
        run: |
          uv run bandit -r extra/ --severity-level medium \
            --format txt -o $GITHUB_WORKSPACE/bandit.txt \
            --skip B101,B008 \
            --exclude extra/*/migrations/* 2>&1 || true
          [ -s $GITHUB_WORKSPACE/bandit.txt ] || echo "No bandit issues." > $GITHUB_WORKSPACE/bandit.txt

      - name: Run pip-audit dependency scan
        run: |
          uv run pip-audit --format json --output $GITHUB_WORKSPACE/pip_audit.json 2>&1 || true
          # Convert JSON to readable text for the AI
          python3 -c "
          import json, sys
          try:
              data = json.load(open('$GITHUB_WORKSPACE/pip_audit.json'))
              deps = data.get('dependencies', [])
              vulns = [d for d in deps if d.get('vulns')]
              if vulns:
                  lines = []
                  for d in vulns:
                      lines.append(f\"{d['name']}=={d['version']}:\")
                      for v in d['vulns']:
                          lines.append(f\"  - {v.get('id', '?')}: {v.get('description', '?')[:120]}\")
                  open('$GITHUB_WORKSPACE/pip_audit.txt', 'w').write('\n'.join(lines))
              else:
                  open('$GITHUB_WORKSPACE/pip_audit.txt', 'w').write('No dependency vulnerabilities found.')
          except Exception as e:
              open('$GITHUB_WORKSPACE/pip_audit.txt', 'w').write(f'Scan failed: {e}')
          "

      # ── Combine all outputs ──────────────────────────────────────
      - name: Build combined report
        run: |
          {
            echo "============================================="
            echo "  RUFF CHECK (linting)"
            echo "============================================="
            cat $GITHUB_WORKSPACE/ruff_check.txt
            echo ""
            echo "============================================="
            echo "  RUFF FORMAT (formatting)"
            echo "============================================="
            cat $GITHUB_WORKSPACE/ruff_format.txt
            echo ""
            echo "============================================="
            echo "  PYRIGHT (type checking)"
            echo "============================================="
            cat $GITHUB_WORKSPACE/pyright.txt
            echo ""
            echo "============================================="
            echo "  BANDIT (security scan)"
            echo "============================================="
            cat $GITHUB_WORKSPACE/bandit.txt
            echo ""
            echo "============================================="
            echo "  PIP-AUDIT (dependency vulnerabilities)"
            echo "============================================="
            cat $GITHUB_WORKSPACE/pip_audit.txt
          } > $GITHUB_WORKSPACE/full_report.txt

          # Also collect recent changes for context
          {
            echo "=== RECENT CHANGES (last 7 days) ==="
            git log --oneline --since="7 days ago" --name-only 2>/dev/null || true
          } > $GITHUB_WORKSPACE/changes.txt

          echo "Combined report built ($(wc -l < $GITHUB_WORKSPACE/full_report.txt) lines)"

      # ── Query AI ─────────────────────────────────────────────────
      - name: Query OpenRouter AI
        id: ai_query
        run: |
          REPORT=$(cat $GITHUB_WORKSPACE/full_report.txt)
          CHANGES=$(cat $GITHUB_WORKSPACE/changes.txt)
          
          # Build prompt
          cat > $GITHUB_WORKSPACE/prompt.txt << 'PROMPTEOF'
          You are a senior security and code quality engineer reviewing a Discord bot monorepo.
          Repository: https://github.com/ariel-aram/AramPacks-BDv3

          ## Project context
          - extra/ contains subpackages for a Discord bot (ballsDex v3)
          - Python 3.14, discord.py 2.7, django 6.x, ballsdex v3
          - Uses ballsdex.core.discord.LayoutView (Components v2)
          - Cards are drawn with Pillow; file access via Django FileField
          - Each cog has app_commands (slash commands) + optional LayoutView UI

          ## Scan results
          PROMPTEOF

          cat $GITHUB_WORKSPACE/full_report.txt >> $GITHUB_WORKSPACE/prompt.txt

          cat >> $GITHUB_WORKSPACE/prompt.txt << 'PROMPTEOF2'

          ## Recent changes
          PROMPTEOF2

          cat $GITHUB_WORKSPACE/changes.txt >> $GITHUB_WORKSPACE/prompt.txt

          cat >> $GITHUB_WORKSPACE/prompt.txt << 'PROMPTEOF3'

          ---

          ## Your task

          Analyze ALL scan results above and identify issues that should be fixed.

          ### Issues to flag and fix (in priority order):
          1. **Security vulnerabilities** (bandit high/medium severity, pip-audit CVEs)
          2. **Runtime bugs** (unhandled exceptions, missing null checks, path traversal, unsafe file access)
          3. **Type safety issues** (pyright errors that indicate real bugs, not just style)
          4. **Lint errors** that suggest broken logic (ruff E/F, not just formatting)
          5. **Dependency issues** (outdated packages with known CVEs)
          6. **Code smells** that commonly cause production issues (bare except, mutable defaults, race conditions)

          ### What NOT to flag:
          - Formatting/style issues (ruff format warnings, import order)
          - Warnings that are suppressed intentionally (noqa comments)
          - Issues in migrations/ files (they are Django versioned)
          - The `ballgpt` external package (not in this repo)

          ### Response format
          If there are no actionable issues, respond with exactly: NO_ISSUES

          If there ARE issues, respond with a JSON array:
          ```json
          [{"file": "extra/Package/subpackage/cog.py", "line": 42, "severity": "high", "category": "security", "fix": "Brief description of what changed", "code": "fixed line of code"}]
          ```

          Severity: "high" (security/crash), "medium" (bug/correctness), "low" (code quality)
          Category: "security", "bug", "type-safety", "dependency", "code-quality"

          Rules:
          - Be conservative: only fix things you are CERTAIN are wrong
          - Preserve existing behavior — do not add features or refactor
          - Do NOT add new dependencies or change imports
          - Do NOT modify migrations/ or test files
          - Keep fixes minimal: change the exact line, not surrounding code
          - For type errors: only fix if the annotation is wrong, not if the tool is being overly strict
          PROMPTEOF3

          # Build JSON payload
          python3 -c "
          import json
          prompt = open('$GITHUB_WORKSPACE/prompt.txt').read()
          payload = {
              'model': 'openai/gpt-5.6-luna',
              'messages': [
                  {'role': 'system', 'content': 'You are a senior security engineer and code reviewer. Output only valid JSON fixes or NO_ISSUES. No commentary, no markdown outside the JSON block.'},
                  {'role': 'user', 'content': prompt}
              ],
              'max_tokens': 8192,
              'temperature': 0.05
          }
          with open('$GITHUB_WORKSPACE/payload.json', 'w') as f:
              json.dump(payload, f)
          "

          # Call OpenRouter API
          curl -s -X POST https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @$GITHUB_WORKSPACE/payload.json > $GITHUB_WORKSPACE/response.json

          # Extract response content
          python3 -c "
          import json
          try:
              resp = json.load(open('$GITHUB_WORKSPACE/response.json'))
              content = resp.get('choices', [{}])[0].get('message', {}).get('content', 'NO_ISSUES')
              open('$GITHUB_WORKSPACE/ai_response.txt', 'w').write(content)
              print('AI response received successfully')
          except Exception as e:
              print(f'Error parsing response: {e}')
              open('$GITHUB_WORKSPACE/ai_response.txt', 'w').write('NO_ISSUES')
          "

          # Show summary for logs
          echo "--- AI Response Summary ---"
          head -c 500 $GITHUB_WORKSPACE/ai_response.txt
          echo ""
          echo "---------------------------"

      # ── Apply fixes ──────────────────────────────────────────────
      - name: Apply AI fixes
        id: apply_fixes
        run: |
          AI_RESPONSE=$(cat $GITHUB_WORKSPACE/ai_response.txt)
          
          if [ "$AI_RESPONSE" = "NO_ISSUES" ]; then
            echo "No actionable issues found."
            echo "fixes_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "Applying AI fixes..."
          
          python3 << 'PYEOF'
          import json, os, re, sys

          workspace = os.environ.get('GITHUB_WORKSPACE', '/github/workspace')

          try:
              content = open(os.path.join(workspace, 'ai_response.txt')).read()

              # Extract JSON from markdown code fence or raw JSON
              json_match = re.search(r'```json\s*(.*?)\s*```', content, re.DOTALL)
              if json_match:
                  fixes = json.loads(json_match.group(1))
              else:
                  fixes = json.loads(content)

              if not isinstance(fixes, list):
                  print("Response is not a JSON array. Skipping.")
                  with open(os.path.join(workspace, 'fixes_result.txt'), 'w') as f:
                      f.write('false')
                  sys.exit(0)

              applied = 0
              skipped = 0
              for fix in fixes:
                  file_path = fix.get('file', '')
                  line = fix.get('line', 0)
                  new_code = fix.get('code', '')
                  reason = fix.get('fix', '')
                  severity = fix.get('severity', 'unknown')
                  category = fix.get('category', 'unknown')

                  if not file_path or not new_code:
                      skipped += 1
                      continue

                  # Skip migrations
                  if '/migrations/' in file_path:
                      print(f"  SKIP (migration): {file_path}:{line}")
                      skipped += 1
                      continue

                  full_path = os.path.join(workspace, file_path.lstrip('./'))

                  if not os.path.exists(full_path):
                      print(f"  SKIP (not found): {file_path}")
                      skipped += 1
                      continue

                  with open(full_path, 'r') as f:
                      lines = f.readlines()

                  if 0 < line <= len(lines):
                      old_line = lines[line - 1].rstrip('\n')
                      lines[line - 1] = new_code + '\n' if not new_code.endswith('\n') else new_code

                      with open(full_path, 'w') as f:
                          f.writelines(lines)

                      print(f"  FIXED [{severity}/{category}]: {file_path}:{line} — {reason}")
                      applied += 1
                  else:
                      print(f"  SKIP (out of range): {file_path}:{line}")
                      skipped += 1

              print(f"\nResult: {applied} applied, {skipped} skipped")

              with open(os.path.join(workspace, 'fixes_result.txt'), 'w') as f:
                  f.write('true' if applied > 0 else 'false')

          except json.JSONDecodeError:
              print("Could not parse AI response as JSON. Skipping.")
              with open(os.path.join(workspace, 'fixes_result.txt'), 'w') as f:
                  f.write('false')
          except Exception as e:
              print(f"Error: {e}")
              with open(os.path.join(workspace, 'fixes_result.txt'), 'w') as f:
                  f.write('false')
          PYEOF

          RESULT=$(cat $GITHUB_WORKSPACE/fixes_result.txt)
          echo "fixes_applied=$RESULT" >> "$GITHUB_OUTPUT"

      # ── Create PR ────────────────────────────────────────────────
      - name: Create Pull Request
        if: steps.apply_fixes.outputs.fixes_applied == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai-weekly-health-check
          commit-message: "fix: AI-driven security and code health fixes"
          title: "[AI] Security + code health fixes"
          body: |
            Automated code health and security review using OpenRouter (`openai/gpt-5.6-luna`).

            **Checks performed:**
            - `ruff check` — linting (E/F/B/UP/RUF/TC rules)
            - `ruff format --check` — formatting
            - `pyright` — type checking
            - `bandit` — Python security scan (injection, secrets, unsafe code)
            - `pip-audit` — dependency vulnerability check

            Review all changes carefully. Each fix is tagged with severity and category.
          labels: |
            automated
            security
            code-quality
