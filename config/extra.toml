# ──────────────────────────────────────────
# V3 Extra Packages Configuration
# ──────────────────────────────────────────
# Packages are installed from the AramPacks-BDv3 monorepo.
# Each entry points to its subdirectory inside the repo
# so the files are not copied into the Ballsdex extra folder.

# Moderation Extra Package
[[ballsdex.packages]]
repo = "https://github.com/ariel-aram/AramPacks-BDv3"
branch = "main"
subdirectory = "extra/Moderation-BD"
enabled = true

