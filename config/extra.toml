# ──────────────────────────────────────────
# V3 Extra Packages Configuration
# ──────────────────────────────────────────
# Packages are installed from the AramPacks-BDv3 monorepo via git+https URLs.
# The `location` value is passed directly to uv pip install.
# The `path` value is the Django app module Ballsdex should load.

# Moderation Extra Package
[[ballsdex.packages]]
location = "git+https://github.com/ariel-aram/AramPacks-BDv3.git@master#subdirectory=extra/Moderation-BD"
path = "moderation_app"
enabled = true

