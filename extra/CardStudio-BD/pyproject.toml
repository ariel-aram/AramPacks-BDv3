[project]
name = "cardstudio-bd"
version = "1.0.0"
description = "Full card customization for Ballsdex v3: fonts, positions, colors and layout. Deprecates bd-fontchanger."
authors = [{name = "arielaram"}]
requires-python = ">=3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardstudio_app"]
