[project]
name = "advent-bd"
version = "1.0.0"
description = "An Advent Calendar extra package for Ballsdex v3, offering daily rewards throughout December."
authors = [{name = "haymooed"}]
requires-python = ">=3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["advent_app"]
